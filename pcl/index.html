<StackPanel xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation" xmlns:sys="clr-namespace:System;assembly=mscorlib" xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml" xmlns:local="clr-namespace:PCL;assembly=Plain Craft Launcher 2">
    <Border Background="#1e293b" CornerRadius="8" Padding="16">
        <!-- Logo -->
        <StackPanel HorizontalAlignment="Center" Margin="0,0,0,12">
            <Image Source="https://www.mcyggdrasill.com/logos/yggdrasill_logo.png" Width="96" Height="96" Stretch="Uniform" />
            <TextBlock Text="mcYggdrasill" FontSize="20" FontWeight="Bold" Foreground="#22c55e" HorizontalAlignment="Center" Margin="0,8,0,2"/>
            <TextBlock Text="世界树服务器" FontSize="12" Foreground="#9ca3af" HorizontalAlignment="Center"/>
        </StackPanel>
        
        <!-- 服务器状态卡片 -->
        <Border Background="#334155" CornerRadius="6" Padding="12" Margin="0,0,0,8">
            <StackPanel>
                <StackPanel Orientation="Horizontal" HorizontalAlignment="Stretch" Margin="0,0,0,8">
                    <TextBlock Text="服务器状态" Foreground="#9ca3af" FontSize="12"/>
                    <Border Background="#22c55e" CornerRadius="4" Padding="4,2,4,2" HorizontalAlignment="Right">
                        <TextBlock Text="在线" Foreground="#000" FontSize="11" FontWeight="Bold"/>
                    </Border>
                </StackPanel>
                <TextBlock Text="IP: play.mcyggdrasill.com" Foreground="#e5e7eb" FontSize="12"/>
                <TextBlock Text="在线人数: " Foreground="#e5e7eb" FontSize="12">
                    <Run Text="--" Foreground="#f59e0b"/>
                </TextBlock>
            </StackPanel>
        </Border>
        
        <!-- 服务器特色 -->
        <Border Background="#334155" CornerRadius="6" Padding="12" Margin="0,0,0,8">
            <StackPanel>
                <TextBlock Text="服务器特色" Foreground="#f59e0b" FontSize="14" FontWeight="Bold" Margin="0,0,0,8"/>
                <StackPanel>
                    <StackPanel Orientation="Horizontal" Margin="0,0,0,4">
                        <TextBlock Text="✓" Foreground="#22c55e" Margin="0,0,6,0"/>
                        <TextBlock Text="公益性服务器，永久免费" Foreground="#e5e7eb" FontSize="12"/>
                    </StackPanel>
                    <StackPanel Orientation="Horizontal" Margin="0,0,0,4">
                        <TextBlock Text="✓" Foreground="#22c55e" Margin="0,0,6,0"/>
                        <TextBlock Text="群组服玩法，多种游戏模式" Foreground="#e5e7eb" FontSize="12"/>
                    </StackPanel>
                    <StackPanel Orientation="Horizontal" Margin="0,0,0,4">
                        <TextBlock Text="✓" Foreground="#22c55e" Margin="0,0,6,0"/>
                        <TextBlock Text="稳定运行，定期备份" Foreground="#e5e7eb" FontSize="12"/>
                    </StackPanel>
                    <StackPanel Orientation="Horizontal">
                        <TextBlock Text="✓" Foreground="#22c55e" Margin="0,0,6,0"/>
                        <TextBlock Text="友好社区，活跃管理" Foreground="#e5e7eb" FontSize="12"/>
                    </StackPanel>
                </StackPanel>
            </StackPanel>
        </Border>
        
        <!-- 公告区域 -->
        <Border Background="#334155" CornerRadius="6" Padding="12" Margin="0,0,0,8">
            <StackPanel>
                <TextBlock Text="最新公告" Foreground="#f59e0b" FontSize="14" FontWeight="Bold" Margin="0,0,0,4"/>
                <TextBlock Text="服务器运行正常，欢迎加入！" Foreground="#e5e7eb" FontSize="12"/>
            </StackPanel>
        </Border>
        
        <!-- 快捷链接 -->
        <Border Background="#334155" CornerRadius="6" Padding="12">
            <StackPanel>
                <TextBlock Text="快捷链接" Foreground="#f59e0b" FontSize="14" FontWeight="Bold" Margin="0,0,0,8"/>
                <StackPanel Orientation="Horizontal" HorizontalAlignment="Stretch" Gap="8">
                    <Button Content="官网" Background="#475569" Foreground="#e5e7eb" FontSize="12" Padding="8,4,8,4" CornerRadius="4" HorizontalAlignment="Stretch"/>
                    <Button Content="复制IP" Background="#475569" Foreground="#e5e7eb" FontSize="12" Padding="8,4,8,4" CornerRadius="4" HorizontalAlignment="Stretch"/>
                </StackPanel>
            </StackPanel>
        </Border>
        
        <!-- 版本信息 -->
        <TextBlock Text="版本: v1.0.3 | mcYggdrasill" FontSize="10" Foreground="#64748b" HorizontalAlignment="Center" Margin="0,12,0,0"/>
    </Border>
</StackPanel>
